  <!-- Глаз -->
  <circle cx="118" cy="42" r="2.5" fill="#000"/>
  
  <!-- Клюв -->
  <path d="M 124 45 L 138 45" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Шея -->
  <path d="M 105 60 Q 100 85 105 110" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  
  <!-- Основное тело -->
