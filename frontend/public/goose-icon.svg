  <line x1="80" y1="190" x2="90" y2="190" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Правая лапа -->
  <line x1="115" y1="175" x2="115" y2="190" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="190" x2="120" y2="190" stroke="#000" stroke-width="3" stroke-linecap="round"/>
</svg>